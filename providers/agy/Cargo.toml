[package]
name = "ai-keyvault-provider-agy"
version = "0.1.0"
edition = "2021"
description = "Adaptador agy (Antigravity) para AI KeyVault — Credential Manager + cuota"

[dependencies]
serde        = { version = "1.0", features = ["derive"] }
serde_json   = "1.0"
thiserror    = "1.0"
chrono       = { version = "0.4", features = ["serde"] }
regex        = "1.11"
dirs-next    = "2.0"

# Windows Credential Manager (solo compila en Windows)
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys  = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security_Credentials",
] }

[dev-dependencies]
tokio    = { version = "1", features = ["full"] }
tempfile = "3"
