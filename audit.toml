# Configuración de cargo-audit para AI KeyVault
# Referencia: https://docs.rs/cargo-audit/latest/cargo_audit/

[advisories]
# RUSTSEC-2023-0071: Marvin Attack en crate `rsa`
# - Nuestro código NO usa RSA directamente.
# - Proviene transitivamente de reqwest (dev-dependency de testing).
# - Impacto: ninguno en producción (reqwest solo se usa en tests locales).
# - Se ignorará hasta que reqwest actualice su cadena de TLS.
ignore = ["RUSTSEC-2023-0071"]

[output]
deny = ["vulnerability"]   # solo vulnerabilidades bloquean; warnings (unmaintained) no bloquean
