[workspace]
# workspace vacío — apps/desktop/src-tauri es su propio workspace Cargo.
# Tiene su propio Cargo.lock y target/ independientes del workspace raíz.
# Usa crates/core como path dependency cross-workspace.
# IMPORTANTE: compilar siempre con `cargo tauri dev/build` desde apps/desktop/,
# nunca con `cargo build` desde la raíz del repositorio.

[package]
name = "ai-keyvault-desktop"
version = "0.2.4"
description = "AI KeyVault — Bóveda y tablero para cuentas de agentes de IA"
authors = ["MiguelGotea"]
edition = "2021"
rust-version = "1.80"

# Tauri requiere este bloque
[[bin]]
name = "ai-keyvault-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-ico", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"

# Bóveda local — crate puro (sin sqlite, sin cmake requerido)
ai-keyvault-core = { path = "../../../crates/core" }

# Fase 13b: switch de cuenta — lectura de home dir para ~/.codex/auth.json
dirs-next = "2"

# UUID para delete_vault_account / comandos de bóveda
uuid = { version = "1", features = ["v4"] }

# chrono — fechas para state_mut().updated_at en vault commands
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
zeroize = "1.8"

# NOTA FASE 12: providers/agy y providers/codex usan rusqlite bundled (requiere cmake).
# Se agregarán en Fase 13 (switch de cuenta) solo si se instala cmake, o bien
# se implementará una interfaz alternativa que lea las credenciales sin el provider crate.

[target.'cfg(target_os = "windows")'.dependencies]
# Windows Credential Manager — para switch real de credenciales agy (Fase 13b)
windows-sys = { version = "0.52", features = [
  "Win32_Security_Credentials",
  "Win32_System_DataExchange",
  "Win32_Foundation",
] }

[profile.dev]
incremental = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

