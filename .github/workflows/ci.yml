name: 🔒 CI — AI KeyVault

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # ─────────────────────────────────────────────
  # 1. Escaneo de secretos (gitleaks) — BLOQUEA si encuentra algo
  # ─────────────────────────────────────────────
  secrets-scan:
    name: 🔍 Escaneo de secretos
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔒 gitleaks — detectar secretos
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # ─────────────────────────────────────────────
  # 2. CI de Rust (cuando exista el código)
  # ─────────────────────────────────────────────
  rust-ci:
    name: 🦀 Rust CI
    runs-on: ubuntu-latest
    needs: secrets-scan
    # Solo ejecutar si hay código Rust
    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🦀 Instalar Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 📦 Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: ✅ cargo fmt --check
        run: cargo fmt --all -- --check

      - name: ✅ cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: ✅ cargo test — núcleo y servidor
        run: cargo test --package ai-keyvault-core --package ai-keyvault-server

      - name: ✅ cargo test — providers agy y codex
        run: cargo test --package ai-keyvault-provider-agy --package ai-keyvault-provider-codex

      - name: ✅ cargo test — poller
        run: cargo test --package ai-keyvault-poller

      - name: 🛡️ cargo audit
        run: |
          cargo install cargo-audit --quiet 2>/dev/null || true
          cargo audit
        continue-on-error: true  # Puede haber advisories no críticos — no bloquea

  # ─────────────────────────────────────────────
  # 3. CI de TypeScript/Frontend (cuando exista)
  # ─────────────────────────────────────────────
  frontend-ci:
    name: 🌐 Frontend CI
    runs-on: ubuntu-latest
    needs: secrets-scan
    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🔍 Verificar si existe frontend
        id: check-frontend
        run: |
          if [ -f "apps/desktop/package.json" ]; then
            echo "has_frontend=true" >> $GITHUB_OUTPUT
          else
            echo "has_frontend=false" >> $GITHUB_OUTPUT
          fi

      - name: 📦 Setup Node.js
        if: steps.check-frontend.outputs.has_frontend == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/desktop/package-lock.json

      - name: 📦 Instalar dependencias
        if: steps.check-frontend.outputs.has_frontend == 'true'
        run: npm ci
        working-directory: apps/desktop

      - name: ✅ ESLint
        if: steps.check-frontend.outputs.has_frontend == 'true'
        run: npm run lint
        working-directory: apps/desktop

      - name: ✅ TypeScript check
        if: steps.check-frontend.outputs.has_frontend == 'true'
        run: npm run typecheck
        working-directory: apps/desktop

      - name: ✅ Vitest
        if: steps.check-frontend.outputs.has_frontend == 'true'
        run: npm run test
        working-directory: apps/desktop
