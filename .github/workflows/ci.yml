name: 🔒 CI — AI KeyVault

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────
  # 1. Escaneo de secretos (gitleaks) — BLOQUEA si encuentra algo
  # ─────────────────────────────────────────────
  secrets-scan:
    name: 🔍 Escaneo de secretos
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔒 gitleaks — detectar secretos
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # ─────────────────────────────────────────────
  # 2. CI de Rust — workspace raíz (server + core + providers + poller)
  # Corre en Linux (cross-compile) — no incluye apps/desktop (workspace aislado)
  # ─────────────────────────────────────────────
  rust-ci:
    name: 🦀 Rust CI (workspace raíz)
    runs-on: ubuntu-latest
    needs: secrets-scan
    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🦀 Instalar Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 📦 Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: ✅ cargo fmt --check
        run: cargo fmt --all -- --check

      - name: ✅ cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: ✅ cargo test — núcleo y servidor
        run: cargo test --package ai-keyvault-core --package ai-keyvault-server

      - name: ✅ cargo test — providers agy y codex
        run: cargo test --package ai-keyvault-provider-agy --package ai-keyvault-provider-codex

      - name: ✅ cargo test — poller
        run: cargo test --package ai-keyvault-poller

      - name: 🛡️ cargo audit
        run: |
          cargo install cargo-audit --quiet 2>/dev/null || true
          cargo audit
        continue-on-error: true  # Puede haber advisories no críticos — no bloquea

  # ─────────────────────────────────────────────
  # 3. CI del Frontend TypeScript (pnpm)
  # Corregido en Fase 10: npm → pnpm
  # ─────────────────────────────────────────────
  frontend-ci:
    name: 🌐 Frontend CI (pnpm)
    runs-on: ubuntu-latest
    needs: secrets-scan
    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🔍 Verificar si existe frontend
        id: check-frontend
        run: |
          if [ -f "apps/desktop/package.json" ]; then
            echo "has_frontend=true" >> $GITHUB_OUTPUT
          else
            echo "has_frontend=false" >> $GITHUB_OUTPUT
          fi

      - name: 📦 Setup Node.js + pnpm
        if: steps.check-frontend.outputs.has_frontend == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Instalar pnpm
        if: steps.check-frontend.outputs.has_frontend == 'true'
        run: npm install -g pnpm

      - name: 📦 Instalar dependencias (pnpm)
        if: steps.check-frontend.outputs.has_frontend == 'true'
        run: pnpm install --frozen-lockfile
        working-directory: apps/desktop

      - name: ✅ TypeScript check
        if: steps.check-frontend.outputs.has_frontend == 'true'
        run: pnpm typecheck
        working-directory: apps/desktop

      - name: ✅ Vitest
        if: steps.check-frontend.outputs.has_frontend == 'true'
        run: pnpm test
        working-directory: apps/desktop

  # ─────────────────────────────────────────────
  # 4. Build del instalador Tauri (windows-latest + MSVC)
  # Agregado en Fase 10 — detecta errores de empaquetado temprano.
  # Solo corre cuando hay cambios en apps/desktop/.
  # ─────────────────────────────────────────────
  tauri-build:
    name: 🖥️ Tauri Build (Windows MSVC)
    runs-on: windows-latest
    permissions:
      contents: write
    needs: [ secrets-scan, frontend-ci ]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🦀 Instalar Rust toolchain (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: 📦 Cache cargo (Windows)
        uses: actions/cache@v4
        with:
          path: |
            ~\.cargo\bin\
            ~\.cargo\registry\index\
            ~\.cargo\registry\cache\
            ~\.cargo\git\db\
            apps\desktop\src-tauri\target\
          key: windows-tauri-cargo-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}

      - name: 📦 Instalar pnpm
        run: npm install -g pnpm

      - name: 📦 Instalar dependencias Node
        run: pnpm install --frozen-lockfile
        working-directory: apps/desktop

      - name: 🔧 Compilar poller para MSVC (sidecar)
        run: cargo build --release --package ai-keyvault-poller --target x86_64-pc-windows-msvc

      - name: 📋 Copiar sidecar con nombre correcto
        run: |
          $src = "target\x86_64-pc-windows-msvc\release\ai-keyvault-poller.exe"
          $dst = "apps\desktop\src-tauri\binaries\ai-keyvault-poller-x86_64-pc-windows-msvc.exe"
          New-Item -ItemType Directory -Force -Path (Split-Path $dst) | Out-Null
          Copy-Item -Path $src -Destination $dst -Force
          $sizeMB = [math]::Round((Get-Item $dst).Length / 1MB, 2)
          Write-Host "[OK] Sidecar copiado: $sizeMB MB"
        shell: pwsh

      - name: 🧹 Limpiar bundles previos del caché
        shell: pwsh
        run: |
          $bundleDir = "apps/desktop/src-tauri/target/release/bundle"
          if (Test-Path $bundleDir) {
            Remove-Item -Recurse -Force $bundleDir
            Write-Host "[OK] Carpeta bundle/ limpiada para evitar instaladores de versiones anteriores."
          }

      - name: 🏗️ cargo tauri build
        run: pnpm tauri build
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: 🔐 Firmar binarios e instaladores (si hay certificado configurado)
        shell: pwsh
        env:
          CERT_B64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          CERT_PASS: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CERT_B64) -or [string]::IsNullOrWhiteSpace($env:CERT_PASS)) {
            Write-Host "[INFO] Sin secrets WINDOWS_CERT_PFX_BASE64 / WINDOWS_CERT_PASSWORD — continuando sin firma Authenticode."
            exit 0
          }
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) {
            Write-Error "No se encontró signtool.exe en el runner."
            exit 1
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP "akv-signing.pfx"
          try {
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:CERT_B64))
            $targets = @()
            $targets += Get-Item "apps/desktop/src-tauri/target/release/ai-keyvault-desktop.exe" -ErrorAction SilentlyContinue
            $targets += Get-Item "target/x86_64-pc-windows-msvc/release/ai-keyvault-poller.exe" -ErrorAction SilentlyContinue
            $targets += Get-ChildItem "apps/desktop/src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue
            $targets += Get-ChildItem "apps/desktop/src-tauri/target/release/bundle/msi/*.msi" -ErrorAction SilentlyContinue
            foreach ($file in $targets) {
              & $signtool.FullName sign /f $pfxPath /p $env:CERT_PASS /fd SHA256 /tr "http://timestamp.digicert.com" /td SHA256 $file.FullName
              if ($LASTEXITCODE -ne 0) { throw "signtool falló en $($file.Name)" }
            }
            Write-Host "[OK] Firma Authenticode aplicada a $($targets.Count) archivo(s)."
          } finally {
            if (Test-Path $pfxPath) { Remove-Item -Force $pfxPath }
          }

      - name: 📦 Empaquetar versión portable (.zip)
        shell: pwsh
        run: |
          $ver = (Get-Content apps/desktop/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $portableDir = "apps/desktop/src-tauri/target/release/bundle/portable"
          $stagingDir = "$portableDir/AI-KeyVault-portable"
          New-Item -ItemType Directory -Force -Path $stagingDir | Out-Null
          Copy-Item "apps/desktop/src-tauri/target/release/ai-keyvault-desktop.exe" "$stagingDir/AI KeyVault.exe" -Force
          Copy-Item "target/x86_64-pc-windows-msvc/release/ai-keyvault-poller.exe" "$stagingDir/ai-keyvault-poller.exe" -Force
          @(
            "AI KeyVault v$ver — Edición Portable (Windows x64)"
            "==================================================="
            "1. Extrae esta carpeta en cualquier ubicación."
            "2. Ejecuta ""AI KeyVault.exe"" (mantén ""ai-keyvault-poller.exe"" en la misma carpeta)."
            "3. Tu bóveda local se almacena cifrada en %APPDATA%\com.miguelgotea.ai-keyvault\."
          ) | Set-Content -Path "$stagingDir/LEEME-PORTABLE.txt" -Encoding UTF8
          $zipPath = "$portableDir/AI-KeyVault-portable-v$ver-win-x64.zip"
          Compress-Archive -Path "$stagingDir/*" -DestinationPath $zipPath -Force
          Remove-Item -Recurse -Force $stagingDir
          Write-Host "[OK] Portable creado: $zipPath"

      - name: 📤 Subir instalador y portable como artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-keyvault-installer-${{ github.sha }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/portable/*.zip
          retention-days: 30

      - name: 🚀 Publicar instalador y portable en GitHub Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $ver = (Get-Content apps/desktop/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $short = "${{ github.sha }}".Substring(0, 7)
          $tag = "v$ver"
          $files = @()
          $files += Get-ChildItem "apps/desktop/src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
          $files += Get-ChildItem "apps/desktop/src-tauri/target/release/bundle/msi/*.msi" -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
          $files += Get-ChildItem "apps/desktop/src-tauri/target/release/bundle/portable/*.zip" -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @files --clobber
          } else {
            gh release create $tag @files --title "AI KeyVault v$ver" --notes "Instalador y versión portable generados automáticamente desde main ($short)." --latest
          }
