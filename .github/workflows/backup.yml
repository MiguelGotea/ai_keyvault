name: 💾 Backup BD → ai_keyvault_data

on:
  schedule:
    - cron: '0 4 * * *'   # 4:00 UTC diario (~10pm CST)
  workflow_dispatch:        # Disparar manualmente desde GitHub UI

jobs:
  backup:
    name: 📦 Snapshot de BD al repo de respaldo
    runs-on: ubuntu-latest

    steps:
      - name: 🔑 Configurar SSH para VPS
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: 📥 Descargar BD del VPS
        run: |
          scp -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_PATH }}/data/keyvault.db \
            ./keyvault_backup.db
          echo "✅ BD descargada: $(du -sh keyvault_backup.db | cut -f1)"

      - name: 📦 Checkout repo de respaldo
        uses: actions/checkout@v4
        with:
          repository: MiguelGotea/ai_keyvault_data
          ssh-key: ${{ secrets.BACKUP_WRITE_KEY }}
          path: backup_repo

      - name: 🔐 Cifrar snapshot y probar restauración (D-04)
        env:
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          if [ -z "$BACKUP_ENCRYPTION_KEY" ]; then
            echo "❌ BACKUP_ENCRYPTION_KEY no está configurado. Abortando para no subir datos sin cifrar."
            exit 1
          fi

          TIMESTAMP=$(date -u +"%Y%m%d_%H%M%S")
          mkdir -p backup_repo/backups
          OUT_ENC="backup_repo/backups/keyvault_${TIMESTAMP}.db.enc"

          openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt \
            -in keyvault_backup.db \
            -out "$OUT_ENC" \
            -pass env:BACKUP_ENCRYPTION_KEY

          # Probar restauración real antes de subir
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 \
            -in "$OUT_ENC" \
            -out ./verify_restore.db \
            -pass env:BACKUP_ENCRYPTION_KEY

          python3 -c "import sqlite3; c=sqlite3.connect('./verify_restore.db'); t=[r[0] for r in c.execute(\"SELECT name FROM sqlite_master WHERE type='table'\")]; assert 'devices' in t and 'vault_snapshots' in t, f'Tablas incompletas: {t}'; print('✅ Restauración verificada, tablas:', len(t))"

          rm -f ./verify_restore.db ./keyvault_backup.db
          echo "Snapshot cifrado: keyvault_${TIMESTAMP}.db.enc"

          # Retener solo los últimos 30 backups cifrados
          BACKUP_COUNT=$(ls backup_repo/backups/keyvault_*.db.enc 2>/dev/null | wc -l)
          if [ "$BACKUP_COUNT" -gt 30 ]; then
            ls -t backup_repo/backups/keyvault_*.db.enc | tail -n +31 | xargs rm -f
            echo "🧹 Backups antiguos eliminados (reteniendo últimos 30)"
          fi

      - name: 🔄 Commit y push al repo de respaldo
        run: |
          cd backup_repo
          git config user.email "ai-keyvault-backup@noreply.github.com"
          git config user.name "AI KeyVault Backup Bot"
          git add backups/
          CHANGED=$(git diff --cached --name-only | wc -l)
          if [ "$CHANGED" -gt 0 ]; then
            git commit -m "backup: snapshot $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
            echo "✅ Backup subido al repo ai_keyvault_data"
          else
            echo "⏩ Sin cambios desde el último backup"
          fi
