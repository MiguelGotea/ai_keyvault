[package]
name = "ai-keyvault-core"
version = "0.1.0"
edition = "2021"
authors = ["AI KeyVault Team"]
description = "Núcleo seguro de AI KeyVault: Argon2id KDF, Vault Key wrapping y XChaCha20-Poly1305"
license = "MIT"

[dependencies]
# KDF y Criptografía
argon2 = { version = "0.5", features = ["std"] }
chacha20poly1305 = { version = "0.10", features = ["std"] }
zeroize = { version = "1.8", features = ["derive", "zeroize_derive"] }
rand = "0.8"
rand_core = { version = "0.6", features = ["std"] }
subtle = "2.6"
data-encoding = "2.6"

# Serialización y utilidades
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"

[dev-dependencies]
hex = "0.4"
