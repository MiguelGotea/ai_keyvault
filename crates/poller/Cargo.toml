[package]
name = "ai-keyvault-poller"
version = "0.1.0"
edition = "2021"
authors = ["AI KeyVault Team"]
description = "Consulta periódica de cuota de agy y Codex con lease anti-duplicado"
license = "MIT"

[[bin]]
name = "ai-keyvault-poller"
path = "src/main.rs"

[lib]
name = "ai_keyvault_poller"
path = "src/lib.rs"

[dependencies]
# Providers de cuota
ai-keyvault-provider-agy = { path = "../../providers/agy" }
ai-keyvault-provider-codex = { path = "../../providers/codex" }

# Async runtime
tokio = { version = "1.40", features = ["full"] }

# HTTP client para subir lecturas al servidor
reqwest = { version = "0.12", features = ["json"] }

# Serialización
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Tiempo
chrono = { version = "0.4", features = ["serde"] }

# Logs
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Errores
thiserror = "1.0"

[dev-dependencies]
tokio = { version = "1.40", features = ["full", "test-util"] }
